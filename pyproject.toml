[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelpt"
version = "0.1.0"
description = "Scoped, defensive penetration-testing toolkit"
requires-python = ">=3.10"

[project.scripts]
sentinelpt = "sentinelpt.cli:main"

[tool.setuptools.packages.find]
include = ["sentinelpt*"]
